<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sahifa topilmadi — Ravnaq Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-64.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .nf img { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 24px; box-shadow: 0 0 0 6px rgba(42,127,255,.35), 0 30px 80px -20px rgba(0,198,255,.6); }
    .nf h1 { font-size: clamp(56px, 10vw, 96px); font-weight: 800; line-height: 1; }
    .nf p { color: var(--muted); margin: 14px auto 28px; max-width: 420px; }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <main class="nf">
    <div>
      <img src="/assets/logo-192.png" alt="Ravnaq Academy">
      <h1 class="grad">404</h1>
      <p>Bunday sahifa topilmadi. Bosh sahifaga qaytib, fanlar va so'rovnomalarni ko'rishingiz mumkin.</p>
      <a class="btn btn--primary btn--lg" href="/">Bosh sahifaga qaytish</a>
    </div>
  </main>
</body>
</html>
